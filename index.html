<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#192737">
  <meta name="description" content="Takt – rejestr czasu pracy">
  <title>Takt · Rejestr czasu pracy</title>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <header class="brand"><span class="wordmark">Takt</span><span>Rejestr czasu pracy</span></header>
  <main id="app" aria-busy="true">
    <p role="status">Sprawdzanie sesji…</p>
  </main>

  <template id="login">
    <section class="panel" aria-labelledby="login-title">
      <h1 id="login-title">Zaloguj się</h1>
      <form>
        <label for="email">Adres e-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Hasło</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Zaloguj się</button>
      </form>
      <p class="message" role="alert" hidden></p>
    </section>
  </template>

  <template id="profile">
    <section class="panel" aria-labelledby="profile-title">
      <h1 id="profile-title"></h1>
      <p id="account-role"></p>
      <button type="button" id="sign-out" class="secondary">Wyloguj się</button>
      <p class="message" role="alert" hidden></p>
    </section>
  </template>
  <template id="shift-panel">
    <div class="shift">
      <h2>Moja zmiana</h2>
      <p id="shift-status" role="status">Pobieranie zmiany…</p>
      <div id="elapsed" class="elapsed" aria-label="Czas zmiany">00:00:00</div>
      <p id="shift-time"></p>
      <button type="button" id="shift-action" disabled>Rozpocznij zmianę</button>
      <div id="recent-proof"></div>
    </div>
  </template>
  <template id="proof-editor">
    <div class="proof">
      <h3 tabindex="-1"></h3>
      <p>Zrób zdjęcie obiektu testowego i pobierz lokalizację urządzenia.</p>
      <video autoplay muted playsinline hidden aria-label="Podgląd kamery"></video>
      <img class="preview" hidden alt="Zdjęcie do potwierdzenia zmiany">
      <button type="button" id="photo">Włącz kamerę</button>
      <p class="hint" id="camera-status" role="status"></p>
      <button type="button" id="geo">Pobierz lokalizację</button>
      <p class="hint" id="geo-status" role="status"></p>
      <div class="actions">
        <button type="button" id="save-proof" disabled>Zapisz potwierdzenie</button>
        <button type="button" id="cancel" class="secondary">Anuluj</button>
      </div>
      <p id="save-status" role="status"></p>
    </div>
  </template>
</body>
</html>
